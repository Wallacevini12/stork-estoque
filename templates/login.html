<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#00e5ff">
  <title>Login — Stork Estoque</title>
  <link rel="stylesheet" href="/static/css/estoque.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand-mark">STORK</span>
      <span class="brand-sub">Estoque</span>
    </div>

    {% if erro %}
    <div class="alert alert--danger">{{ erro }}</div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="field">
        <label class="field-label">Usuário</label>
        <input class="field-input" type="text" name="usuario"
               autocomplete="username" autocapitalize="none"
               required autofocus>
      </div>
      <div class="field">
        <label class="field-label">Senha</label>
        <input class="field-input" type="password" name="senha"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--full" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
